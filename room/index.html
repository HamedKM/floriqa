<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Room – Floriqa</title>
  <link rel="icon" href="../images/favicon.ico" />
  <link rel="stylesheet" href="../assets/floriqa.css" />
</head>
<body class="app">
  <main class="app-wrap">
    <!-- Connexion / inscription -->
    <section id="auth" class="card auth-box hidden">
      <div class="tabs"><button class="tab active" data-auth="in">Connexion</button><button class="tab" data-auth="up">Créer un compte</button></div>
      <form id="inForm">
        <label class="field"><span>E-mail</span><input type="email" name="email" required autocomplete="username"></label>
        <label class="field"><span>Mot de passe</span><input type="password" name="password" required autocomplete="current-password"></label>
        <button class="btn primary" type="submit">Entrer dans la Room</button>
        <p style="margin-top:.8rem"><a href="#" id="forgot" class="muted">Mot de passe oublié ?</a></p>
      </form>
      <form id="upForm" class="hidden">
        <label class="field"><span>Nom d'artiste ou prénom</span><input type="text" name="name" required maxlength="80"></label>
        <label class="field"><span>E-mail</span><input type="email" name="email" required autocomplete="username"></label>
        <label class="field"><span>Mot de passe (8 caractères minimum)</span><input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
        <label class="field"><span>Un mot pour l'équipe (facultatif)</span><input type="text" name="message" maxlength="300"></label>
        <button class="btn primary" type="submit">Demander l'accès</button>
      </form>
      <p class="muted" style="margin-top:1rem">La Room est un espace privé pour les artistes et l'équipe Floriqa. Chaque nouveau compte est validé par un admin.</p>
    </section>

    <!-- En attente -->
    <section id="pending" class="card auth-box hidden">
      <h2>Demande envoyée 🌸</h2>
      <p class="muted" id="pendingText">Un admin doit valider ton accès. Reviens sur cette page un peu plus tard.</p>
      <form id="reqForm" class="hidden" style="margin-top:1rem">
        <label class="field"><span>Nom d'artiste ou prénom</span><input type="text" name="name" required maxlength="80"></label>
        <label class="field"><span>Un mot pour l'équipe (facultatif)</span><input type="text" name="message" maxlength="300"></label>
        <button class="btn primary" type="submit">Demander l'accès</button>
      </form>
      <p style="margin-top:1rem"><button class="btn" data-logout>Se déconnecter</button></p>
    </section>

    <!-- Room -->
    <section id="room" class="hidden">
      <div class="toolbar">
        <h2 class="grow">Room</h2>
        <span class="muted" id="who"></span>
        <a class="btn hidden" id="adminLink" href="../admin/">Admin</a>
        <button class="btn" data-logout>Déconnexion</button>
      </div>
      <div class="split">
        <aside>
          <button class="btn primary" id="newProject" style="width:100%;justify-content:center;margin-bottom:.8rem">+ Nouveau projet</button>
          <input type="text" id="pSearch" placeholder="Rechercher un projet" style="margin-bottom:.8rem">
          <div id="pList"></div>
        </aside>
        <section id="pView" class="card"><p class="muted">Choisis un projet à gauche, ou crée-en un nouveau.</p></section>
      </div>
    </section>
  </main>

  <script>window.FLQ_BASE = "../";</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/config.js"></script>
  <script src="../assets/common.js"></script>
  <script src="room.js"></script>
</body>
</html>
