<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Press kit – Floriqa</title>
  <link rel="icon" href="images/favicon.ico" />
  <link rel="stylesheet" href="assets/floriqa.css?v=1795648574" />
  <style>
    .pk-sec { margin-top: 1.5rem; padding: 1.2rem; }
    .pk-sec h2 { font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 1rem; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .8rem; }
    .gallery a { display: block; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: rgba(0,0,0,.2); position: relative; }
    .gallery img { width: 100%; height: 100%; object-fit: cover; }
    .gallery span { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.6); font-size: .75rem; padding: .2rem .5rem; border-radius: 6px; }
    .dl-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .7rem .9rem; border-radius: 8px; background: rgba(255,255,255,.08); margin-bottom: .5rem; }
    .dl-row button, .dl-btn { background: #fff; color: #223a5c; border: 0; border-radius: 6px; padding: .45rem .9rem; font-weight: 700; cursor: pointer; text-decoration: none; font-size: .85rem; white-space: nowrap; }
    .links { display: flex; gap: .6rem; flex-wrap: wrap; margin: .6rem 0 1rem; }
    .links a { padding: .35rem .8rem; border-radius: 999px; background: rgba(255,255,255,.15); text-decoration: none; font-size: .85rem; font-weight: 600; }
    .pk-msg { padding: 1rem 1.2rem; margin-bottom: 1.5rem; white-space: pre-line; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="page" id="content"><div class="glass soon">Loading…</div></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js?v=1795648574"></script>
  <script src="assets/common.js?v=1795648574"></script>
  <script>
    const { esc, media, buildChrome, fmtSize, cfg } = Floriqa;
    buildChrome({});
    const key = new URLSearchParams(location.search).get("k") || "";
    // la clé secrète est envoyée à la base à chaque demande : sans elle, rien n'est visible
    const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {
      global: { headers: { "x-floriqa-key": key } }, auth: { persistSession: false },
    });
    const CAT = { photo: "High-res photos", presentation: "Presentations & riders", video: "Videos", audio: "Audio", admin: "Administrative documents", other: "Other files" };
    const el = document.getElementById("content");
    const fail = () => { el.innerHTML = `<div class="glass soon">This private link is invalid or has expired. Please contact the Floriqa team.</div>`; };

    (async () => {
      if (!/^[a-f0-9]{64}$/.test(key)) return fail();
      const { data: pk } = await sb.from("floriqa_presskits").select("artist_id,message").maybeSingle();
      if (!pk) return fail();
      const { data: a } = await sb.from("floriqa_artists")
        .select("*, floriqa_tracks(title,audio_url,sort), floriqa_videos(title,video_url,vertical,sort), floriqa_artist_photos(url,caption,sort)")
        .eq("id", pk.artist_id).maybeSingle();
      if (!a) return fail();
      const { data: files } = await sb.from("floriqa_presskit_files").select("*").eq("artist_id", a.id).order("category").order("sort");
      document.title = `${a.name} – Press kit – Floriqa`;

      const by = (x, y) => x.sort - y.sort;
      const tracks = (a.floriqa_tracks || []).sort(by), vids = (a.floriqa_videos || []).sort(by), photos = (a.floriqa_artist_photos || []).sort(by);
      const pubPhotos = [a.photo_url, a.card_url, ...photos.map((p) => p.url)].filter((v, i, s) => v && s.indexOf(v) === i);
      const privPhotos = (files || []).filter((f) => f.category === "photo");
      const others = (files || []).filter((f) => f.category !== "photo");
      const links = [["Instagram", a.instagram], ["Spotify", a.spotify], ["SoundCloud", a.soundcloud], ["YouTube", a.youtube], ["Website", a.website]].filter((l) => l[1]);
      const groups = {};
      others.forEach((f) => (groups[f.category] ||= []).push(f));

      el.innerHTML = `
        ${pk.message ? `<div class="glass pk-msg">${esc(pk.message)}</div>` : ""}
        <div class="artist-layout">
          <aside class="artist-side">
            ${a.photo_url || a.card_url ? `<div class="artist-photo"><img src="${esc(media(a.photo_url || a.card_url))}" alt="${esc(a.name)}"></div>` : ""}
            <a class="btn-glass" href="affair.html?artist=${encodeURIComponent(a.name)}">Book ${esc(a.name)}</a>
          </aside>
          <section>
            <div class="artist-head"><h1>${esc(a.name)}</h1><p class="tag">${esc(a.tagline || "")} · Press kit</p></div>
            ${links.length ? `<div class="links">${links.map(([l, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${l}</a>`).join("")}</div>` : ""}
            ${a.bio ? `<div class="artist-bio glass">${esc(a.bio)}</div>` : ""}
          </section>
        </div>

        ${pubPhotos.length || privPhotos.length ? `<div class="glass pk-sec"><h2>Photos</h2><div class="gallery" id="gal">
          ${pubPhotos.map((u) => `<a href="${esc(media(u))}" download target="_blank"><img loading="lazy" src="${esc(media(u))}"><span>↓</span></a>`).join("")}
          ${privPhotos.map((f) => `<a href="#" data-photo="${esc(f.storage_path)}" data-name="${esc(f.name)}"><img loading="lazy" alt="${esc(f.name)}"><span>↓ HD</span></a>`).join("")}
        </div></div>` : ""}

        ${tracks.length ? `<div class="glass pk-sec"><h2>Music</h2>${tracks.map((t) => `
          <div class="dl-row" style="flex-wrap:wrap"><strong>${esc(t.title)}</strong><a class="dl-btn" href="${esc(media(t.audio_url))}" download>Download</a>
          <audio controls preload="none" style="width:100%" src="${esc(media(t.audio_url))}"></audio></div>`).join("")}</div>` : ""}

        ${vids.length ? `<div class="glass pk-sec"><h2>Videos</h2>${vids.map((v) => `
          <div class="${v.vertical ? "video-v" : "video-h"}" style="${v.vertical ? "max-width:320px" : ""}"><video controls preload="metadata" playsinline src="${esc(media(v.video_url))}"></video></div>`).join("")}</div>` : ""}

        ${Object.entries(groups).map(([c, list]) => `<div class="glass pk-sec"><h2>${CAT[c]}</h2>${list.map((f) => `
          <div class="dl-row"><span>${esc(f.name)} <span class="muted">· ${fmtSize(f.size_bytes)}</span></span><button data-dl="${esc(f.storage_path)}" data-name="${esc(f.name)}">Download</button></div>`).join("")}</div>`).join("")}
      `;

      // photos privées : aperçu + téléchargement par lien temporaire
      for (const aEl of el.querySelectorAll("[data-photo]")) {
        const { data } = await sb.storage.from("floriqa-presskit").createSignedUrl(aEl.dataset.photo, 3600);
        if (data) aEl.querySelector("img").src = data.signedUrl;
        aEl.addEventListener("click", async (e) => { e.preventDefault(); await download(aEl.dataset.photo, aEl.dataset.name); });
      }
      el.querySelectorAll("[data-dl]").forEach((b) => b.addEventListener("click", () => download(b.dataset.dl, b.dataset.name)));
      el.addEventListener("play", (e) => el.querySelectorAll("audio,video").forEach((m) => m !== e.target && m.pause()), true);
    })();

    async function download(path, name) {
      const { data, error } = await sb.storage.from("floriqa-presskit").createSignedUrl(path, 600, { download: name });
      if (error || !data) return alert("Download failed. Please try again.");
      location.href = data.signedUrl;
    }
  </script>
</body>
</html>
