<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Affair – Booking – Floriqa</title>
  <link rel="icon" href="images/favicon.ico" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    .form .date-field { position: relative; display: flex; align-items: center; gap: .55rem; margin-bottom: .9rem; padding: .6rem .7rem; border-radius: 6px; background: #fff; color: var(--navy); font-size: .95rem; cursor: pointer; }
    .form .date-field svg { width: 16px; height: 16px; flex-shrink: 0; }
    .form .date-field .dtext { flex: 1; }
    .form .date-field .dtext.empty { color: rgba(34,58,92,.6); }
    .form .date-field .del { background: none; border: 0; padding: 0 .1rem; font: inherit; font-size: 1.15rem; line-height: 1; color: var(--navy); cursor: pointer; }
    .form .date-field input[type=date] { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; margin: 0; padding: 0; opacity: 0; pointer-events: none; }
    .form .link-btn { display: block; background: none; border: 0; color: #fff; font: inherit; font-size: .95rem; cursor: pointer; padding: 0; margin: -.3rem 0 .9rem; }
    .form select:invalid { color: rgba(34,58,92,.6); }
    .form select option { color: var(--navy); }
  </style>
  <link rel="stylesheet" href="assets/floriqa.css?v=1795649192" />
</head>
<body>
  <main class="page">
    <form id="bookingForm" class="form glass" novalidate>
      <h3>ARTIST</h3>
      <select id="artist" name="artist_name" required>
        <option value="" disabled selected>Select an artist</option>
      </select>

      <h3>PROMOTER DETAILS</h3>
      <input type="text" name="organization" placeholder="Organisation" required maxlength="200" />
      <input type="text" name="promoter" placeholder="Promoter" required maxlength="200" />
      <div class="row2">
        <input type="tel" name="phone" placeholder="+216 99 999 999" required maxlength="40" />
        <input type="email" name="email" placeholder="Promoter's e-mail address" required maxlength="200" />
      </div>

      <h3>EVENT DETAILS</h3>
      <input type="text" name="event" placeholder="Event" required maxlength="200" />
      <input type="text" name="venue" placeholder="Venue" required maxlength="200" />
      <div id="dateList"></div>
      <button type="button" class="link-btn" id="addDate">+ Add another date</button>
      <input type="hidden" name="dates" />
      <input type="text" name="lineup" placeholder="Confirmed line-up" required maxlength="500" />
      <div class="row2">
        <select name="country" id="country" required><option value="" disabled selected>Country</option></select>
        <input type="text" name="city" placeholder="City" required maxlength="100" />
      </div>
      <input type="url" name="social_link" placeholder="Instagram or Facebook link (optional)" maxlength="300" />

      <h3>PERFORMANCE</h3>
      <label class="toggle-line off" data-for="b2b">
        <span class="switch"><input type="checkbox" id="t_b2b"><span class="slider"></span></span>
        <span class="title">B2B</span>
      </label>
      <div class="toggle-content hidden" id="c_b2b"><input type="text" name="b2b" placeholder="B2B (artist name)" maxlength="200"></div>
      <div class="row2">
        <select data-time="start" required aria-label="Set starts"><option value="" disabled selected>Set starts</option><option value="0">12:00 AM</option><option value="15">12:15 AM</option><option value="30">12:30 AM</option><option value="45">12:45 AM</option><option value="60">1:00 AM</option><option value="75">1:15 AM</option><option value="90">1:30 AM</option><option value="105">1:45 AM</option><option value="120">2:00 AM</option><option value="135">2:15 AM</option><option value="150">2:30 AM</option><option value="165">2:45 AM</option><option value="180">3:00 AM</option><option value="195">3:15 AM</option><option value="210">3:30 AM</option><option value="225">3:45 AM</option><option value="240">4:00 AM</option><option value="255">4:15 AM</option><option value="270">4:30 AM</option><option value="285">4:45 AM</option><option value="300">5:00 AM</option><option value="315">5:15 AM</option><option value="330">5:30 AM</option><option value="345">5:45 AM</option><option value="360">6:00 AM</option><option value="375">6:15 AM</option><option value="390">6:30 AM</option><option value="405">6:45 AM</option><option value="420">7:00 AM</option><option value="435">7:15 AM</option><option value="450">7:30 AM</option><option value="465">7:45 AM</option><option value="480">8:00 AM</option><option value="495">8:15 AM</option><option value="510">8:30 AM</option><option value="525">8:45 AM</option><option value="540">9:00 AM</option><option value="555">9:15 AM</option><option value="570">9:30 AM</option><option value="585">9:45 AM</option><option value="600">10:00 AM</option><option value="615">10:15 AM</option><option value="630">10:30 AM</option><option value="645">10:45 AM</option><option value="660">11:00 AM</option><option value="675">11:15 AM</option><option value="690">11:30 AM</option><option value="705">11:45 AM</option><option value="720">12:00 PM</option><option value="735">12:15 PM</option><option value="750">12:30 PM</option><option value="765">12:45 PM</option><option value="780">1:00 PM</option><option value="795">1:15 PM</option><option value="810">1:30 PM</option><option value="825">1:45 PM</option><option value="840">2:00 PM</option><option value="855">2:15 PM</option><option value="870">2:30 PM</option><option value="885">2:45 PM</option><option value="900">3:00 PM</option><option value="915">3:15 PM</option><option value="930">3:30 PM</option><option value="945">3:45 PM</option><option value="960">4:00 PM</option><option value="975">4:15 PM</option><option value="990">4:30 PM</option><option value="1005">4:45 PM</option><option value="1020">5:00 PM</option><option value="1035">5:15 PM</option><option value="1050">5:30 PM</option><option value="1065">5:45 PM</option><option value="1080">6:00 PM</option><option value="1095">6:15 PM</option><option value="1110">6:30 PM</option><option value="1125">6:45 PM</option><option value="1140">7:00 PM</option><option value="1155">7:15 PM</option><option value="1170">7:30 PM</option><option value="1185">7:45 PM</option><option value="1200">8:00 PM</option><option value="1215">8:15 PM</option><option value="1230">8:30 PM</option><option value="1245">8:45 PM</option><option value="1260">9:00 PM</option><option value="1275">9:15 PM</option><option value="1290">9:30 PM</option><option value="1305">9:45 PM</option><option value="1320">10:00 PM</option><option value="1335">10:15 PM</option><option value="1350">10:30 PM</option><option value="1365">10:45 PM</option><option value="1380">11:00 PM</option><option value="1395">11:15 PM</option><option value="1410">11:30 PM</option><option value="1425">11:45 PM</option></select>
        <select data-time="end" required aria-label="Set ends"><option value="" disabled selected>Set ends</option><option value="0">12:00 AM</option><option value="15">12:15 AM</option><option value="30">12:30 AM</option><option value="45">12:45 AM</option><option value="60">1:00 AM</option><option value="75">1:15 AM</option><option value="90">1:30 AM</option><option value="105">1:45 AM</option><option value="120">2:00 AM</option><option value="135">2:15 AM</option><option value="150">2:30 AM</option><option value="165">2:45 AM</option><option value="180">3:00 AM</option><option value="195">3:15 AM</option><option value="210">3:30 AM</option><option value="225">3:45 AM</option><option value="240">4:00 AM</option><option value="255">4:15 AM</option><option value="270">4:30 AM</option><option value="285">4:45 AM</option><option value="300">5:00 AM</option><option value="315">5:15 AM</option><option value="330">5:30 AM</option><option value="345">5:45 AM</option><option value="360">6:00 AM</option><option value="375">6:15 AM</option><option value="390">6:30 AM</option><option value="405">6:45 AM</option><option value="420">7:00 AM</option><option value="435">7:15 AM</option><option value="450">7:30 AM</option><option value="465">7:45 AM</option><option value="480">8:00 AM</option><option value="495">8:15 AM</option><option value="510">8:30 AM</option><option value="525">8:45 AM</option><option value="540">9:00 AM</option><option value="555">9:15 AM</option><option value="570">9:30 AM</option><option value="585">9:45 AM</option><option value="600">10:00 AM</option><option value="615">10:15 AM</option><option value="630">10:30 AM</option><option value="645">10:45 AM</option><option value="660">11:00 AM</option><option value="675">11:15 AM</option><option value="690">11:30 AM</option><option value="705">11:45 AM</option><option value="720">12:00 PM</option><option value="735">12:15 PM</option><option value="750">12:30 PM</option><option value="765">12:45 PM</option><option value="780">1:00 PM</option><option value="795">1:15 PM</option><option value="810">1:30 PM</option><option value="825">1:45 PM</option><option value="840">2:00 PM</option><option value="855">2:15 PM</option><option value="870">2:30 PM</option><option value="885">2:45 PM</option><option value="900">3:00 PM</option><option value="915">3:15 PM</option><option value="930">3:30 PM</option><option value="945">3:45 PM</option><option value="960">4:00 PM</option><option value="975">4:15 PM</option><option value="990">4:30 PM</option><option value="1005">4:45 PM</option><option value="1020">5:00 PM</option><option value="1035">5:15 PM</option><option value="1050">5:30 PM</option><option value="1065">5:45 PM</option><option value="1080">6:00 PM</option><option value="1095">6:15 PM</option><option value="1110">6:30 PM</option><option value="1125">6:45 PM</option><option value="1140">7:00 PM</option><option value="1155">7:15 PM</option><option value="1170">7:30 PM</option><option value="1185">7:45 PM</option><option value="1200">8:00 PM</option><option value="1215">8:15 PM</option><option value="1230">8:30 PM</option><option value="1245">8:45 PM</option><option value="1260">9:00 PM</option><option value="1275">9:15 PM</option><option value="1290">9:30 PM</option><option value="1305">9:45 PM</option><option value="1320">10:00 PM</option><option value="1335">10:15 PM</option><option value="1350">10:30 PM</option><option value="1365">10:45 PM</option><option value="1380">11:00 PM</option><option value="1395">11:15 PM</option><option value="1410">11:30 PM</option><option value="1425">11:45 PM</option></select>
      </div>
      <input type="text" id="durOut" readonly tabindex="-1" placeholder="Duration (calculated automatically)" />
      <input type="hidden" name="perf_time" />
      <input type="hidden" name="duration" />

      <h3>OFFER DETAILS</h3>
      <input type="text" name="fee" placeholder="Net fee offer in €" required maxlength="50" />
      <label class="toggle-line" data-for="transport">
        <span class="switch"><input type="checkbox" id="t_transport" checked><span class="slider"></span></span>
        <span class="title">+ Transport</span>
      </label>
      <div class="toggle-content" id="c_transport"><input type="text" name="transport_details" placeholder="Driver or reimbursement?" maxlength="300"></div>
      <label class="toggle-line" data-for="accommodation">
        <span class="switch"><input type="checkbox" id="t_accommodation" checked><span class="slider"></span></span>
        <span class="title">+ Accommodation</span>
      </label>
      <div class="toggle-content" id="c_accommodation"><input type="text" name="accommodation_details" placeholder="Lodging or reimbursement?" maxlength="300"></div>
      <label class="toggle-line" data-for="hospitality">
        <span class="switch"><input type="checkbox" id="t_hospitality" checked><span class="slider"></span></span>
        <span class="title">+ Hospitality</span>
      </label>
      <div class="toggle-content" id="c_hospitality"><input type="text" name="hospitality_details" placeholder="Hospitality details..." maxlength="300"></div>

      <!-- piège anti-robots : reste vide pour les humains -->
      <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">

      <button class="btn-white" type="submit" id="sendBtn">Send Booking Request</button>
    </form>

    <div id="done" class="success glass hidden">
      <h2>THANK YOU</h2>
      <p>Your booking request has been received. A confirmation has been sent to your e-mail address — simply reply to it to continue the conversation with our team.</p>
      <a class="btn-white" style="display:inline-block;text-decoration:none" href="artists.html">See our other artists</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js?v=1795649192"></script>
  <script src="assets/common.js?v=1795649192"></script>
  <script>
    const { sb, buildChrome, toast } = Floriqa;
    buildChrome({ active: "Affair" });

    const form = document.getElementById("bookingForm");
    const select = document.getElementById("artist");
    const wanted = new URLSearchParams(location.search).get("artist");

    (async () => {
      const { data } = await sb.from("floriqa_artists").select("id,name").eq("published", true).order("sort").order("name");
      (data || []).forEach(a => { const o = new Option(a.name, a.name); o.dataset.id = a.id; select.add(o); });
      if (wanted) {
        // lien d'un artiste : le formulaire est réservé à cet artiste, on ne peut pas en choisir un autre
        let opt = [...select.options].find(o => o.value.toLowerCase() === wanted.toLowerCase());
        if (!opt) {
          const { data: hit } = await sb.rpc("floriqa_artist_by_name", { p_name: wanted });
          const a = hit?.[0];
          opt = new Option(a?.name || wanted, a?.name || wanted);
          if (a) opt.dataset.id = a.id;
        }
        select.innerHTML = ""; select.add(opt); opt.selected = true;
        select.classList.add("locked"); select.tabIndex = -1;
        select.addEventListener("mousedown", (e) => e.preventDefault());
        select.addEventListener("keydown", (e) => { if (e.key !== "Tab") e.preventDefault(); });
      }
    })();

    // interrupteurs OUI/NON
    document.querySelectorAll(".toggle-line").forEach(line => {
      const key = line.dataset.for;
      const box = document.getElementById("t_" + key);
      const content = document.getElementById("c_" + key);
      const update = () => { line.classList.toggle("off", !box.checked); content.classList.toggle("hidden", !box.checked); };
      box.addEventListener("change", update); update();
    });

    // ----- pays (ordre alphabétique) -----
    (() => {
      const sel = document.getElementById("country");
      const names = new Intl.DisplayNames(["en"], { type: "region" });
      "AF AX AL DZ AS AD AO AI AG AR AM AW AU AT AZ BS BH BD BB BY BE BZ BJ BM BT BO BA BW BR BN BG BF BI CV KH CM CA KY CF TD CL CN CO KM CG CD CK CR CI HR CU CW CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FO FJ FI FR GF PF GA GM GE DE GH GI GR GL GD GP GU GT GG GN GW GY HT HN HK HU IS IN ID IR IQ IE IM IL IT JM JP JE JO KZ KE KI XK KW KG LA LV LB LS LR LY LI LT LU MO MG MW MY MV ML MT MH MQ MR MU YT MX FM MD MC MN ME MS MA MZ MM NA NR NP NL NC NZ NI NE NG MK NO OM PK PW PS PA PG PY PE PH PL PT PR QA RE RO RU RW BL KN LC MF PM VC WS SM ST SA SN RS SC SL SG SX SK SI SB SO ZA KR SS ES LK SD SR SE CH SY TW TJ TZ TH TL TG TO TT TN TR TM TC TV UG UA AE GB US UY UZ VU VA VE VN VG VI YE ZM ZW".split(" ").map(c => names.of(c)).sort((a, b) => a.localeCompare(b, "en"))
        .forEach(n => sel.add(new Option(n, n)));
    })();

    // ----- dates -----
    const dateList = document.getElementById("dateList");
    const today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
    const minDate = today.toISOString().slice(0, 10);
    const addDate = () => {
      const row = document.createElement("div");
      row.className = "date-field";
      row.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span class="dtext empty">Performance date</span>
        <button type="button" class="del" title="Remove this date" aria-label="Remove this date">×</button>
        <input type="date" min="${minDate}" tabindex="-1" aria-label="Performance date">`;
      const inp = row.querySelector("input"), txt = row.querySelector(".dtext");
      const paint = () => { txt.textContent = inp.value ? fmtDay(inp.value) : "Performance date"; txt.classList.toggle("empty", !inp.value); };
      inp.addEventListener("change", paint);
      row.addEventListener("click", (e) => {
        if (e.target.closest(".del")) return;
        try { inp.showPicker(); } catch { inp.style.pointerEvents = "auto"; inp.focus(); inp.click(); }
      });
      row.querySelector(".del").onclick = () => {
        if (dateList.children.length > 1) row.remove(); else { inp.value = ""; paint(); }
      };
      dateList.appendChild(row);
    };
    addDate();
    document.getElementById("addDate").onclick = addDate;
    const fmtDay = (v) => { const [y, m, d] = v.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" }); };
    const readDates = () => [...new Set([...dateList.querySelectorAll("input")].map(i => i.value).filter(Boolean))].sort();

    // ----- horaires AM/PM -----
    const readTime = (k) => {
      const sel = document.querySelector(`select[data-time="${k}"]`);
      if (!sel.value) return null;
      return { label: sel.selectedOptions[0].text, min: +sel.value };
    };
    const duration = () => {
      const a = readTime("start"), b = readTime("end");
      if (!a || !b) return null;
      let d = b.min - a.min; if (d <= 0) d += 24 * 60;
      return d;
    };
    const fmtDur = (d) => `${Math.floor(d / 60)} h${d % 60 ? " " + String(d % 60).padStart(2, "0") : ""}`;
    document.querySelectorAll("select[data-time]").forEach(s => s.addEventListener("change", () => {
      const d = duration();
      document.getElementById("durOut").value = d ? "Duration: " + fmtDur(d) : "";
    }));

    const socialOk = (u) => !u || /^(https?:\/\/)?(www\.|m\.)?(instagram\.com|facebook\.com|fb\.com)\/\S+$/i.test(u.trim());

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const days = readDates();
      if (!days.length) { dateList.querySelector(".date-field").scrollIntoView({ block: "center" }); toast("Please choose the performance date.", "err"); return; }
      const st = readTime("start"), en = readTime("end");
      if (!st || !en) { toast("Please choose the start and end time of the set.", "err"); return; }
      form.dates.value = days.map(fmtDay).join(", ");
      form.perf_time.value = `${st.label} – ${en.label}`;
      form.duration.value = fmtDur(duration());
      const fd = new FormData(form);
      if (fd.get("website")) return; // robot
      const missing = [...form.querySelectorAll("[required]")].find(i => !String(i.value).trim());
      if (missing) { missing.focus(); toast("Please fill in all required fields.", "err"); return; }
      const emailEl = form.querySelector("[name=email]");
      if (!emailEl.checkValidity()) { emailEl.focus(); toast("Please enter a valid e-mail address.", "err"); return; }
      if (!socialOk(fd.get("social_link"))) { toast("Please enter a valid Instagram or Facebook link, or leave it empty.", "err"); return; }

      const t = (k) => document.getElementById("t_" + k).checked;
      const v = (k) => (fd.get(k) || "").toString().trim() || null;
      const row = {
        id: crypto.randomUUID(),
        artist_id: select.selectedOptions[0]?.dataset.id || null,
        artist_name: v("artist_name"), organization: v("organization"), promoter: v("promoter"), phone: v("phone"), email: v("email"),
        event: v("event"), venue: v("venue"), dates: v("dates"), lineup: v("lineup"), country: v("country"), city: v("city"),
        social_link: v("social_link"), b2b: t("b2b") ? v("b2b") : null, duration: v("duration"), perf_time: v("perf_time"), fee: v("fee"),
        transport: t("transport"), transport_details: t("transport") ? v("transport_details") : null,
        accommodation: t("accommodation"), accommodation_details: t("accommodation") ? v("accommodation_details") : null,
        hospitality: t("hospitality"), hospitality_details: t("hospitality") ? v("hospitality_details") : null,
      };

      const btn = document.getElementById("sendBtn");
      btn.disabled = true; btn.textContent = "Sending…";
      const { error } = await sb.from("floriqa_bookings").insert(row);
      if (error) {
        btn.disabled = false; btn.textContent = "Send Booking Request";
        toast("Sorry, the request could not be sent. Please try again.", "err");
        console.error(error); return;
      }
      // e-mail de confirmation au promoteur + alerte au manager de l'artiste
      Floriqa.mail({ type: "booking", id: row.id });
      form.classList.add("hidden");
      document.getElementById("done").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
